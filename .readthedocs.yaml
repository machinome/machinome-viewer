version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
    nodejs: "22"
  jobs:
    pre_build:
      - npm ci --prefix machinome_viewer/widget --no-audit --no-fund
      - npm run build --prefix machinome_viewer/widget

python:
  install:
    - requirements: docs/requirements.txt

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true
