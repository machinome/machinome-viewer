name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  widget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: machinome_viewer/widget/package-lock.json
      - working-directory: machinome_viewer/widget
        run: npm ci
      - working-directory: machinome_viewer/widget
        run: npm run typecheck
      - working-directory: machinome_viewer/widget
        run: npm test
      - working-directory: machinome_viewer/widget
        run: npm run build

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: machinome_viewer/widget/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build the widget the suite photographs
        working-directory: machinome_viewer/widget
        run: |
          npm ci
          npm run build
      - name: Install the package with its browser
        run: |
          pip install -e ".[dev]"
          playwright install --with-deps chromium
      - run: python -m pytest

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: machinome_viewer/widget/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      # Kept in step with .readthedocs.yaml: the manual's live demo loads
      # the built bundle, and Read the Docs fails on any warning.
      - name: Build the widget the manual embeds
        working-directory: machinome_viewer/widget
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - run: pip install -r docs/requirements.txt
      - name: Build docs (fail on warnings)
        run: python -m sphinx -b html -W docs docs/_build

  dist:
    runs-on: ubuntu-latest
    needs: [widget, python]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - name: Build and smoke the distributions without publishing
        run: scripts/check-dist
